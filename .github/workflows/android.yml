name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (preinstalled)
        run: |
          set -x
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK/platforms" || true
          SM="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" >/dev/null 2>&1 || true
          "$SM" "platforms;android-37" "build-tools;37.0.0" \
            || "$SM" --channel=3 "platforms;android-37" "build-tools;37.0.0" \
            || "$SM" --channel=4 "platforms;android-37" "build-tools;37.0.0" || true
          ls "$SDK/platforms" || true

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.MULTISYNC_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > keystore/release.jks; fi

      - name: Build release
        env:
          MULTISYNC_STORE_PASS: ${{ secrets.MULTISYNC_STORE_PASS }}
          MULTISYNC_KEY_ALIAS: ${{ secrets.MULTISYNC_KEY_ALIAS }}
          MULTISYNC_KEY_PASS: ${{ secrets.MULTISYNC_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiSync-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
